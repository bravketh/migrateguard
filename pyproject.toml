[project]
name = "migrateguard"
version = "0.1.0"
description = "CI-integrated static analysis that catches backward-incompatible SQL migrations before they ship."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
migrateguard = "migrateguard.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["migrateguard*"]
